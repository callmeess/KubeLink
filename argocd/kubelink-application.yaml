apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelink
  namespace: argocd
spec:
  project: kubelink
  source:
    repoURL: https://github.com/callmeess/KubeLink.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kubelink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
