apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: url-shortener
  namespace: kubelink
spec:
  ingressClassName: nginx
  host: kubelink.com
  tls:
    secret: kubelink-tls
  policies:
    - name: jwt-policy
  upstreams:
    - name: auth-service
      service: auth-service # Must match exact service name
      port: 80
    - name: shortener
      service: shortener
      port: 3000
  routes:
    - path: /shorten/
      action:
        proxy:
          upstream: shortener
      policies:
        - name: jwt-policy
    - path: /api/Auth/register/
      action:
        proxy:
          upstream: auth-service
    - path: /
      action:
        redirect:
          url: /api/Auth/
          code: 302
